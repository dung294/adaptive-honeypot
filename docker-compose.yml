version: '3.8'

services:
  adaptive_honeypot:
    build: .
    container_name: adaptive_honeypot_gateway
    restart: always
    ports:
      # Cổng 80: Web Decoy (RCE, LFI)
      - "80:80"
      # Cổng 2222: SSH Honeypot
      - "2222:2222"
    environment:
      - SSH_HOST=0.0.0.0
      - SSH_PORT=2222
      - WEB_HOST=0.0.0.0
      - WEB_PORT=80
      - PIPELINE_URL=http://192.168.2.76:8000/api/analyze
      - LLM_PROVIDER=heuristic
    volumes:
      # Mount thư mục log ra ngoài host để phân tích thời gian thực
      - ./logs:/app/logs
      # Mount thư mục quarantine để lưu trữ các mẫu mã độc hacker tải lên
      - ./quarantine:/app/quarantine
    command: ["python", "run_all.py"]
