version: '3.8'

services:
  adaptive_honeypot:
    build: .
    container_name: adaptive_honeypot
    restart: always
    ports:
      # Lớp 7: Cổng Web mồi nhử công khai (Hứng tấn công RCE, File Leak)
      - "80:80"
      # Lớp 4: Cổng SSH Honeypot (Cả cổng 22 scan mặc định và cổng 2222 trong config leak)
      - "22:2222"
      - "2222:2222"
      # SOC Dashboard: Giao diện giám sát & API cấp feed log cho AI Máy 2
      - "8080:8080"
    environment:
      - WEB_HOST=0.0.0.0
      - WEB_PORT=80
      - SSH_HOST=0.0.0.0
      - SSH_PORT=2222
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8080
      - ENABLE_THREAT_LABELING=true
      - PYTHONUNBUFFERED=1
      # Nếu có Gemini API Key, cấu hình trong file .env
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      # Mount thư mục logs ra ngoài máy chủ host để bảo toàn dữ liệu & đối soát
      - ./logs:/app/logs
      # Mount thư mục quarantine để lưu trữ malware hacker tải về
      - ./quarantine:/app/quarantine
