version: '3.8'

services:
  adaptive_honeypot:
    build: .
    container_name: adaptive_honeypot_gateway
    restart: always
    ports:
      # Ánh xạ cổng 2222 trên máy chủ vào port 2222 của Honeypot
      # (Trên VPS thật có thể đổi thành "22:2222" để hứng trọn traffic scan port 22)
      - "2222:2222"
    environment:
      - SSH_PORT=2222
      - LLM_MODEL=qwen2.5-coder:7b
      - OLLAMA_API_URL=http://host.docker.internal:11434/api/generate
    volumes:
      # Mount thư mục log ra ngoài host để SV3 phân tích thời gian thực
      - ./logs:/app/logs
      # Mount thư mục quarantine để lưu trữ các mẫu mã độc hacker tải lên
      - ./quarantine:/app/quarantine
    extra_hosts:
      # Cho phép container kết nối về Ollama đang chạy trên máy chủ host
      - "host.docker.internal:host-gateway"
