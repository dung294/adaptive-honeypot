<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Thành Viên & Quản Trị - Coolmate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; background-color: #f8fafc; color: #1e293b; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; width: 100%; max-width: 440px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); padding: 40px; }
        .brand-logo { font-size: 24px; font-weight: 900; color: #151821; letter-spacing: -0.5px; }
        .brand-logo span { color: #2f5acf; }
        .form-control { border-radius: 8px; border: 1px solid #cbd5e1; padding: 10px 14px; font-size: 14px; }
        .form-control:focus { border-color: #2f5acf; box-shadow: 0 0 0 3px rgba(47,90,207,0.15); }
        .btn-cm-dark { background-color: #151821; color: #ffffff; font-weight: 700; border-radius: 8px; padding: 11px; font-size: 14px; border: none; width: 100%; }
        .btn-cm-dark:hover { background-color: #2f5acf; color: #ffffff; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-logo mb-2">COOLMATE<span>.ME</span></div>
            <h5 class="fw-bold mb-1">Đăng Nhập Coolmate Club</h5>
            <p class="text-secondary small">Cổng xác thực tài khoản thành viên & Quản trị kho vận</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 px-3 small d-flex align-items-center gap-2 mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        <!-- Form Đăng nhập có lỗ hổng SQL Injection -->
        <form method="POST" action="/login">
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold text-secondary">Tài khoản / Email nhân viên</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary border-end-0"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="admin hoặc kho_coolmate" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold text-secondary">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-secondary border-end-0"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-cm-dark">
                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng Nhập Hệ Thống
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center">
            <a href="/" class="text-secondary text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i> Quay về Cửa hàng Coolmate
            </a>
            <div class="text-muted mt-3" style="font-size: 11px;">
                Mọi hành vi dò mật khẩu hoặc khai thác trái phép đều được ghi nhận tự động vào Audit Log và chuyển tiếp tới Trung tâm SOC (Máy 1).
            </div>
        </div>
    </div>

</body>
</html>
