<!DOCTYPE html>
<html lang="vi" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị Hệ Thống - TechShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .login-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 12px 36px rgba(0,0,0,0.6); }
        .form-control { background-color: #010409; border-color: #30363d; color: #f0f6fc; }
        .form-control:focus { background-color: #010409; border-color: #58a6ff; color: #f0f6fc; }
    </style>
</head>
<body>

    <div class="login-card p-4 p-sm-5">
        <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-dark border border-secondary mb-3">
                <i class="bi bi-cpu text-primary fs-1"></i>
            </div>
            <h4 class="fw-bold text-light mb-1">TECHSHOP PORTAL</h4>
            <p class="text-secondary small">Đăng nhập tài khoản Quản trị & Nhân viên bán hàng</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 px-3 small d-flex align-items-center gap-2 mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <div>{{ error }}</div>
        </div>
        {% endif %}

        <!-- Form Đăng nhập có lỗ hổng SQL Injection -->
        <form method="POST" action="/login">
            <div class="mb-3">
                <label for="username" class="form-label text-secondary small fw-semibold">Tài khoản nhân viên (Username)</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="admin hoặc kho_hang" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label text-secondary small fw-semibold">Mật khẩu (Password)</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-key"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập hệ thống
            </button>
        </form>

        <div class="mt-4 pt-3 border-top border-secondary text-center">
            <a href="/" class="text-secondary text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i> Quay về trang chủ cửa hàng
            </a>
            <div class="text-secondary small mt-3" style="font-size: 11px;">
                Mọi hành vi truy cập trái phép đều được ghi nhận nhật ký (Audit Log) và chuyển tiếp tới Trung tâm Điều hành An ninh mạng SOC (Máy 1).
            </div>
        </div>
    </div>

</body>
</html>
